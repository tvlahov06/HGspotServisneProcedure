<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HGspot Admin Panel</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #6B1A6B 0%, #9B2D8E 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== LOGIN ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h1 { color: #6B1A6B; margin-bottom: 8px; font-size: 1.8em; }
        .login-box p { color: #888; margin-bottom: 30px; }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.4em;
            transition: all 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #6B1A6B;
            box-shadow: 0 0 0 3px rgba(107,26,107,0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #6B1A6B 0%, #9B2D8E 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(107,26,107,0.4); }
        .login-error { color: #e53935; margin-top: 12px; font-size: 0.95em; display: none; }

        /* ===== GITHUB SETUP SCREEN ===== */
        #setupScreen { display: none; }

        .setup-box {
            background: white;
            border-radius: 15px;
            padding: 35px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .setup-box h2 { color: #6B1A6B; margin-bottom: 8px; font-size: 1.4em; }
        .setup-box > p { color: #888; margin-bottom: 25px; font-size: 0.95em; }



        .setup-form .form-group { margin-bottom: 16px; }

        .setup-form label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 0.9em;
        }

        .setup-form input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 9px;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .setup-form input:focus {
            outline: none;
            border-color: #6B1A6B;
            box-shadow: 0 0 0 3px rgba(107,26,107,0.1);
        }

        .setup-form input[type="password"] { letter-spacing: 2px; }

        .btn-setup-save {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #6B1A6B 0%, #9B2D8E 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-setup-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(107,26,107,0.4); }

        /* ===== ADMIN PANEL ===== */
        #adminPanel { display: none; }

        .admin-header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .admin-header h1 { color: #6B1A6B; font-size: 1.5em; }
        .admin-header p { color: #888; font-size: 0.85em; margin-top: 3px; }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn-settings {
            background: #f3e5f5;
            color: #6B1A6B;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn-settings:hover { background: #e1bee7; }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover { background: #d32f2f; }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number { font-size: 2.5em; font-weight: 700; color: #6B1A6B; }
        .stat-label { color: #888; font-size: 0.9em; margin-top: 5px; }

        /* ===== SEARCH + ACTION BAR ===== */
        .search-action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        .search-action-bar .search-bar {
            flex: 1;
            margin-bottom: 0;
        }

        .btn-primary {
            background: linear-gradient(180deg, #6B1A6B 0%, #9B2D8E 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(107,26,107,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ===== SEARCH ===== */
        .search-bar {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            border: none;
            font-size: 1em;
            outline: none;
            color: #333;
        }

        /* ===== BRAND LIST ===== */
        .brand-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .brand-card {
            padding: 13px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }

        .brand-card:last-child { border-bottom: none; }
        .brand-card:hover { background: #faf5fb; }
        .brand-card-info h3 { color: #6B1A6B; font-size: 1em; margin-bottom: 2px; font-weight: 600; }
        .brand-card-info p { color: #888; font-size: 0.82em; }
        .servisi-nazivi { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
        .servis-naziv-tag { color: #6B1A6B; font-size: 0.82em; font-weight: 400; }
        .servis-naziv-tag:not(:last-child)::after { content: ','; margin-right: 2px; }
        .brand-card-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .btn-edit {
            background: #f3e5f5;
            color: #6B1A6B;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn-edit:hover { background: #e1bee7; }

        .btn-delete {
            background: #ffebee;
            color: #e53935;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn-delete:hover { background: #ffcdd2; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .sort-select {
            padding: 9px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.9em;
            background: white;
            color: #444;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .sort-select:focus { border-color: #6B1A6B; }

        .results-count {
            color: white;
            font-size: 0.85em;
            opacity: 0.85;
            margin-left: auto;
        }

        /* ===== PAGINACIJA ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: white;
            color: #6B1A6B;
            border: 2px solid #e0e0e0;
            padding: 7px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.2s;
            min-width: 36px;
        }

        .page-btn:hover { border-color: #9B2D8E; background: #f3e5f5; }
        .page-btn.active { background: #6B1A6B; color: white; border-color: #6B1A6B; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== UPLOAD AREA ===== */
        .doc-upload-area {
            border: 2px dashed #ce93d8;
            border-radius: 9px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #faf5fb;
        }

        .doc-upload-area:hover { background: #f3e5f5; border-color: #9B2D8E; }
        .doc-upload-icon { font-size: 1.8em; margin-bottom: 6px; }
        .doc-upload-text { font-size: 0.95em; font-weight: 600; color: #6B1A6B; }
        .doc-upload-hint { font-size: 0.8em; color: #aaa; margin-top: 3px; }
        .doc-existing-info { font-size: 0.85em; color: #555; padding: 8px 0 4px; }
        .servis-docs-section { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e0e0e0; }
        .servis-docs-label { font-weight: 600; color: #444; font-size: 0.9em; margin-bottom: 8px; }
        .document-block { margin-bottom: 8px; }
        .doc-existing-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3e5f5;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.88em;
            color: #6B1A6B;
            font-weight: 500;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal h2 {
            color: #6B1A6B;
            margin-bottom: 25px;
            font-size: 1.4em;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 9px;
            font-size: 0.95em;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #6B1A6B;
            box-shadow: 0 0 0 3px rgba(107,26,107,0.1);
        }

        .form-group textarea { resize: vertical; min-height: 70px; }

        /* ===== SERVISI ===== */
        .servisi-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .servisi-section h3 { color: #6B1A6B; margin-bottom: 15px; font-size: 1em; }

        .servis-block {
            background: white;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .servis-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .servis-block-header span { font-weight: 700; color: #6B1A6B; font-size: 0.9em; }

        .btn-remove-servis {
            background: #ffebee;
            color: #e53935;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
        }

        .btn-remove-servis:hover { background: #ffcdd2; }

        .btn-add-servis {
            background: #f3e5f5;
            color: #6B1A6B;
            border: 2px dashed #ce93d8;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-add-servis:hover { background: #e1bee7; }

        /* ===== MODAL AKCIJE ===== */
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .btn-save {
            flex: 1;
            background: linear-gradient(180deg, #6B1A6B 0%, #9B2D8E 100%);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(107,26,107,0.4); }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 13px 24px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover { background: #e0e0e0; }

        /* ===== SAVING OVERLAY ===== */
        .saving-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }

        .saving-overlay.active { display: flex; }

        .saving-box {
            background: white;
            border-radius: 16px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .saving-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3e5f5;
            border-top-color: #6B1A6B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .saving-box p { color: #6B1A6B; font-weight: 600; font-size: 1.1em; }
        .saving-box small { color: #888; font-size: 0.85em; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #323232;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 9999;
            transition: transform 0.4s ease;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #43a047; }
        .toast.error { background: #e53935; }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .empty-state p { color: #888; font-size: 1.1em; }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .search-action-bar { flex-direction: column; }
            .search-action-bar .btn-primary { width: 100%; justify-content: center; }
            .admin-header { flex-direction: column; gap: 15px; text-align: center; }
            .modal { padding: 25px 20px; }
            .stat-number { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>🔧 HGspot</h1>
            <p>Admin Panel - Servisne Procedure</p>
            <input
                type="password"
                id="passwordInput"
                placeholder="••••"
                onkeydown="if(event.key==='Enter') login()"
                autofocus
            >
            <button class="login-btn" onclick="login()">🔓 Prijava</button>
            <p class="login-error" id="loginError">❌ Pogrešna lozinka!</p>
        </div>
    </div>

    <!-- ===== GITHUB SETUP ===== -->
    <div id="setupScreen">
        <div class="setup-box">
            <h2>⚙️ GitHub Token</h2>
            <p>Unesi GitHub token za automatsko spremanje.</p>

            <div class="setup-form">
                <div class="form-group">
                    <label>GitHub Token *</label>
                    <input type="password" id="setupToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                </div>
                <button class="btn-setup-save" onclick="saveGithubSettings()">✅ Spremi i nastavi</button>
            </div>
        </div>
    </div>

    <!-- ===== ADMIN PANEL ===== -->
    <div id="adminPanel">

        <!-- Header -->
        <div class="admin-header">
            <div>
                <h1>🔧 HGspot Admin Panel</h1>
            </div>
            <div class="header-actions">
                <button class="btn-settings" onclick="showSetup()">
                    <span id="statusDot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin-right:6px;vertical-align:middle;"></span>⚙️ GitHub
                </button>
                <button class="logout-btn" onclick="logout()">🚪 Odjava</button>
            </div>
        </div>

        <!-- Statistika -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="statBrands">0</div>
                <div class="stat-label">Brandova</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statServisi">0</div>
                <div class="stat-label">Servisa</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statDocs">0</div>
                <div class="stat-label">Dokumenata</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statWebsites">0</div>
                <div class="stat-label">Websiteova</div>
            </div>
        </div>

        <!-- Akcije -->
        <!-- Pretraga + Dodaj Brand u jednom redu -->
        <div class="search-action-bar">
            <div class="search-bar">
                <input
                    type="text"
                    id="adminSearch"
                    placeholder="🔍  Pretraži po brandu ili servisu..."
                    oninput="filterBrands()"
                >
            </div>
            <button class="btn-primary" id="addBrandBtn" onclick="openAddModal()">➕ Dodaj Brand</button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <select class="sort-select" id="sortSelect" onchange="filterBrands()">
                <option value="unos_novo">Najnoviji unos</option>
                <option value="unos_staro">Najstariji unos</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
            <span class="results-count" id="resultsCount"></span>
        </div>

        <!-- Brand lista -->
        <div class="brand-list" id="brandList"></div>

        <!-- Paginacija -->
        <div class="pagination" id="pagination"></div>

    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">➕ Dodaj Novi Brand</h2>

            <div class="form-group">
                <label>Naziv Branda *</label>
                <input type="text" id="brandName" placeholder="npr. Samsung">
            </div>

            <div class="servisi-section">
                <h3>🏢 Servisi</h3>
                <div id="servisiContainer"></div>
                <button class="btn-add-servis" onclick="addServisBlock()">➕ Dodaj još jedan servis</button>
            </div>

            <div class="modal-actions">
                <button class="btn-save" id="saveBtn" onclick="saveBrand()">💾 Spremi Brand</button>
                <button class="btn-cancel" onclick="closeModal()">Odustani</button>
            </div>
        </div>
    </div>

    <!-- ===== SAVING OVERLAY ===== -->
    <div class="saving-overlay" id="savingOverlay">
        <div class="saving-box">
            <div class="saving-spinner"></div>
            <p id="savingText">Spremam na GitHub...</p>
            <small>Molimo pričekajte</small>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== KONSTANTE =====
        const ADMIN_PASSWORD = '2233';
        const STORAGE_KEY = 'hgspot_brandDatabase';
        const GITHUB_SETTINGS_KEY = 'hgspot_github_settings';
        const GITHUB_USERNAME = 'tvlahov06';
        const GITHUB_REPO = 'HGspotServisneProcedure';

        let brandDatabase = [];
        let editingIndex = -1;
        let fileSHA = null; // GitHub zahtijeva SHA za update

        // ===== LOGIN =====
        function login() {
            const pw = document.getElementById('passwordInput').value;
            if (pw === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                const settings = getGithubSettings();
                if (!settings) {
                    showSetup();
                } else {
                    showAdminPanel();
                }
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        // ===== GITHUB SETTINGS =====
        function getGithubSettings() {
            const saved = localStorage.getItem(GITHUB_SETTINGS_KEY);
            if (!saved) return null;
            try { return JSON.parse(saved); } catch(e) { return null; }
        }

        function saveGithubSettings() {
            const token = document.getElementById('setupToken').value.trim();

            if (!token) {
                showToast('❌ Token je obavezan!', 'error');
                return;
            }

            if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
                showToast('❌ Token mora počinjati sa ghp_ ili github_pat_', 'error');
                return;
            }

            localStorage.setItem(GITHUB_SETTINGS_KEY, JSON.stringify({ token }));
            showToast('✅ Token spremljen!', 'success');
            setTimeout(() => showAdminPanel(), 800);
        }

        function showSetup() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'block';

            const settings = getGithubSettings();
            if (settings) {
                document.getElementById('setupToken').value = settings.token;
            }
        }

        function showAdminPanel() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadDatabase();
        }

        // ===== GITHUB API =====
        async function githubFetch(method, path, body = null) {
            const settings = getGithubSettings();

            if (!settings || !settings.token) {
                throw new Error('Token nije postavljen - klikni ⚙️ GitHub i unesi token');
            }

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${path}`;

            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${settings.token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                }
            };

            if (body) options.body = JSON.stringify(body);

            const response = await fetch(url, options);

            if (!response.ok) {
                let errorMsg = `HTTP ${response.status}`;
                try {
                    const error = await response.json();
                    errorMsg = error.message || errorMsg;
                } catch(e) {}

                if (response.status === 401) throw new Error('Token nije valjan ili je istekao - provjeri token');
                if (response.status === 403) throw new Error('Nema dozvole - provjeri scope tokena (treba "repo")');
                if (response.status === 404) throw new Error('Repozitorij ili file nije pronađen - provjeri naziv repo');
                throw new Error(errorMsg);
            }

            return response.json();
        }

        // ===== UČITAVANJE IZ GITHUBA =====
        async function loadDatabase() {
            updateGithubStatus('loading');

            try {
                const data = await githubFetch('GET', 'brandDatabase.json');
                fileSHA = data.sha; // Spremi SHA za buduće updateove

                // UTF-8 dekodiranje koje podržava hrvatska slova (š, đ, č, ć, ž)
                const binaryString = atob(data.content.replace(/\n/g, ''));
                const uint8Array = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    uint8Array[i] = binaryString.charCodeAt(i);
                }
                const decoded = new TextDecoder('utf-8').decode(uint8Array);
                brandDatabase = JSON.parse(decoded);

                // Spremi lokalno kao backup
                localStorage.setItem(STORAGE_KEY, JSON.stringify(brandDatabase));

                updateGithubStatus('ok');
                console.log(`✅ Učitano ${brandDatabase.length} brandova iz GitHuba`);

            } catch (error) {
                console.error('❌ GitHub greška:', error);

                // Fallback na localStorage
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    brandDatabase = JSON.parse(saved);
                    updateGithubStatus('offline');
                    console.warn('⚠️ Koristim lokalnu kopiju');
                } else {
                    brandDatabase = [];
                    updateGithubStatus('error', error.message);
                }
            }

            renderBrandList();
            updateStats();
        }

        // ===== UPLOAD FILE NA GITHUB =====
        async function uploadFileToGithub(fileName, base64Content) {
            const path = `documents/${fileName}`;

            // Provjeri postoji li već file (treba SHA za update)
            let existingSha = null;
            try {
                const existing = await githubFetch('GET', path);
                existingSha = existing.sha;
            } catch(e) {
                // File ne postoji - novi upload, OK
            }

            const body = {
                message: `Upload dokumenta: ${fileName}`,
                content: base64Content
            };

            if (existingSha) body.sha = existingSha;

            return await githubFetch('PUT', path, body);
        }

        // ===== SPREMI NA GITHUB =====
        async function saveToGithub() {
            const settings = getGithubSettings();
            const jsonContent = JSON.stringify(brandDatabase, null, 2);
            // UTF-8 enkodiranje koje podržava hrvatska slova (š, đ, č, ć, ž)
            const uint8Array = new TextEncoder().encode(jsonContent);
            const binaryString = Array.from(uint8Array).map(b => String.fromCharCode(b)).join('');
            const encoded = btoa(binaryString);

            const body = {
                message: `Admin: ažuriranje brandDatabase.json (${brandDatabase.length} brandova)`,
                content: encoded,
                sha: fileSHA
            };

            const result = await githubFetch('PUT', 'brandDatabase.json', body);
            fileSHA = result.content.sha; // Ažuriraj SHA za sljedeći put

            // Spremi lokalno kao backup
            localStorage.setItem(STORAGE_KEY, JSON.stringify(brandDatabase));

            return result;
        }

        // ===== GITHUB STATUS UI =====
        function updateGithubStatus(status, message = '') {
            const dot = document.getElementById('statusDot');

            switch(status) {
                case 'loading':
                    dot.style.background = '#fb8c00';
                    break;
                case 'ok':
                    dot.style.background = '#43a047';
                    break;
                case 'offline':
                    dot.style.background = '#fb8c00';
                    break;
                case 'error':
                    dot.style.background = '#e53935';
                    showToast(`❌ ${message}`, 'error');
                    break;
            }
        }

        // ===== STATISTIKA =====
        function updateStats() {
            document.getElementById('statBrands').textContent = brandDatabase.length;
            let totalServisi = 0, totalDocs = 0, totalWebsites = 0;
            brandDatabase.forEach(b => {
                (b.servisi || []).forEach(s => {
                    totalServisi++;
                    totalDocs += (s.documents || []).length;
                    if (s.website) totalWebsites++;
                });
                // Backward compatibility
                totalDocs += (b.documents || []).length;
                if (b.website) totalWebsites++;
            });
            document.getElementById('statServisi').textContent = totalServisi;
            document.getElementById('statDocs').textContent = totalDocs;
            document.getElementById('statWebsites').textContent = totalWebsites;
        }

        // ===== RENDERIRANJE LISTE =====
        const PAGE_SIZE = 20;
        let currentPage = 1;
        let currentFilter = '';

        function filterBrands() {
            currentFilter = document.getElementById('adminSearch').value;
            currentPage = 1;
            renderBrandList();
        }

        function renderBrandList() {
            const list = document.getElementById('brandList');
            const pagination = document.getElementById('pagination');
            const sortVal = document.getElementById('sortSelect').value;

            // Filter - po brandu I po nazivu servisa
            let filtered = brandDatabase.filter(b => {
                const term = currentFilter.toLowerCase();
                if (!term) return true;
                if (b.brand.toLowerCase().includes(term)) return true;
                if ((b.servisi || []).some(s => s.service && s.service.toLowerCase().includes(term))) return true;
                return false;
            });

            // Sort
            filtered.sort((a, b) => {
                if (sortVal === 'az') return a.brand.localeCompare(b.brand, 'hr');
                if (sortVal === 'za') return b.brand.localeCompare(a.brand, 'hr');
                if (sortVal === 'unos_novo') return brandDatabase.indexOf(b) - brandDatabase.indexOf(a);
                if (sortVal === 'unos_staro') return brandDatabase.indexOf(a) - brandDatabase.indexOf(b);
                return 0;
            });

            // Rezultati count
            document.getElementById('resultsCount').textContent =
                filtered.length > 0 ? `${filtered.length} brand${filtered.length !== 1 ? 'a' : ''}` : '';

            // Empty state
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <p>${currentFilter ? '🔍 Nema rezultata za "' + currentFilter + '"' : '📭 Baza je prazna. Dodaj prvi brand!'}</p>
                    </div>`;
                pagination.innerHTML = '';
                return;
            }

            // Paginacija - pri pretrazi prikaži sve
            const isSearching = currentFilter.trim() !== '';
            const paginated = isSearching ? filtered : filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

            // Render lista
            list.innerHTML = paginated.map(brand => {
                const realIdx = brandDatabase.indexOf(brand);
                const servisCount = (brand.servisi || []).length;
                let docCount = (brand.documents || []).length;
                let websiteCount = brand.website ? 1 : 0;
                (brand.servisi || []).forEach(s => {
                    docCount += (s.documents || []).length;
                    if (s.website) websiteCount++;
                });
                const servisiNazivi = (brand.servisi || [])
                    .filter(s => s.service)
                    .map(s => `<span class="servis-naziv-tag">${s.service}</span>`)
                    .join('');
                return `
                    <div class="brand-card">
                        <div class="brand-card-info">
                            <h3>${brand.brand}</h3>
                            <p>${servisCount} servis${servisCount !== 1 ? 'a' : ''} · ${docCount} dokument${docCount !== 1 ? 'a' : ''} · ${websiteCount} website</p>
                            ${servisiNazivi ? `<div class="servisi-nazivi">${servisiNazivi}</div>` : ''}
                        </div>
                        <div class="brand-card-actions">
                            <button class="btn-edit" onclick="openEditModal(${realIdx})">✏️ Uredi</button>
                            <button class="btn-delete" onclick="deleteBrand(${realIdx})">🗑️ Briši</button>
                        </div>
                    </div>`;
            }).join('');

            // Render paginacija (samo ako nema pretrage)
            if (!isSearching && totalPages > 1) {
                let pages = '';

                // Prethodna
                pages += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

                // Brojevi stranica
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        pages += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        pages += `<span style="color:white;padding:0 4px;">...</span>`;
                    }
                }

                // Sljedeća
                pages += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;

                pagination.innerHTML = pages;
            } else {
                pagination.innerHTML = '';
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderBrandList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== MODAL - DODAJ =====
        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = '➕ Dodaj Novi Brand';
            document.getElementById('brandName').value = '';
            document.getElementById('servisiContainer').innerHTML = '';
            addServisBlock();
            document.getElementById('modalOverlay').classList.add('active');
        }

        // ===== MODAL - UREDI =====
        function openEditModal(idx) {
            editingIndex = idx;
            const brand = brandDatabase[idx];
            document.getElementById('modalTitle').textContent = '✏️ Uredi Brand';
            document.getElementById('brandName').value = brand.brand;
            document.getElementById('servisiContainer').innerHTML = '';
            (brand.servisi || []).forEach(s => addServisBlock(s));
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ===== SERVIS BLOK =====
        function addServisBlock(data = null) {
            const container = document.getElementById('servisiContainer');
            const idx = container.children.length + 1;
            const servisId = 'servis_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
            const div = document.createElement('div');
            div.className = 'servis-block';
            div.dataset.servisId = servisId;
            div.innerHTML = `
                <div class="servis-block-header">
                    <span>🏢 Servis ${idx}</span>
                    <button class="btn-remove-servis" onclick="removeServisBlock(this)">✕ Ukloni</button>
                </div>
                <div class="form-group">
                    <label>Naziv servisa</label>
                    <input type="text" class="servis-naziv" placeholder="npr. Samsung Ovlašteni Servis Zagreb" value="${data ? escHtml(data.service) : ''}">
                </div>
                <div class="form-group">
                    <label>Dobavljač</label>
                    <input type="text" class="servis-dobavljac" placeholder="npr. Samsung Electronics" value="${data ? escHtml(data.dobavljac || '') : ''}">
                </div>
                <div class="form-group">
                    <label>Adresa</label>
                    <input type="text" class="servis-adresa" placeholder="npr. Vukovarska 78, Zagreb" value="${data ? escHtml(data.address) : ''}">
                </div>
                <div class="form-group">
                    <label>Kontakt</label>
                    <input type="text" class="servis-kontakt" placeholder="npr. info@samsung.hr, 01 234 5678" value="${data ? escHtml(data.kontakt) : ''}">
                </div>
                <div class="form-group">
                    <label>Napomena</label>
                    <input type="text" class="servis-napomena" placeholder="Slanje na trošak primatelja" value="${data ? escHtml(data.napomena) : ''}">
                </div>
                <div class="form-group">
                    <label>🔗 Website</label>
                    <input type="text" class="servis-website" placeholder="https://www.example.com" value="${data ? escHtml(data.website || '') : ''}">
                </div>
                <div class="servis-docs-section">
                    <div class="servis-docs-label">📄 Dokumenti</div>
                    <div class="servis-docs-container" id="${servisId}_docs"></div>
                    <button class="btn-add-servis" style="margin-top:8px;" onclick="addDocumentToServis('${servisId}')">➕ Dodaj dokument</button>
                </div>`;
            container.appendChild(div);
            renumberServisi();

            // Ako ima postojeće dokumente (edit mode)
            if (data && data.documents) {
                data.documents.forEach(doc => addDocumentToServis(servisId, doc));
            }
        }

        function removeServisBlock(btn) {
            btn.closest('.servis-block').remove();
            renumberServisi();
        }

        function renumberServisi() {
            document.querySelectorAll('#servisiContainer .servis-block').forEach((b, i) => {
                b.querySelector('.servis-block-header span').textContent = `🏢 Servis ${i + 1}`;
            });
        }

        // ===== DOKUMENT PO SERVISU =====
        function addDocumentToServis(servisId, data = null) {
            const container = document.getElementById(`${servisId}_docs`);
            if (!container) return;
            const blockId = 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
            const div = document.createElement('div');
            div.className = 'document-block';
            div.dataset.blockId = blockId;

            if (data) {
                div.innerHTML = `
                    <div class="doc-existing-row">
                        <span>📎 ${escHtml(data.name)}</span>
                        <button class="btn-remove-servis" onclick="this.closest('.document-block').remove()">✕</button>
                    </div>
                    <input type="hidden" class="doc-naziv" value="${escHtml(data.name)}">
                    <input type="hidden" class="doc-url" value="${escHtml(data.url)}">
                    <input type="hidden" class="doc-file-content" value="">`;
            } else {
                div.innerHTML = `
                    <div class="doc-upload-area" onclick="document.getElementById('${blockId}_input').click()">
                        <div class="doc-upload-icon">📎</div>
                        <div class="doc-upload-text">Klikni za odabir dokumenta</div>
                        <div class="doc-upload-hint">PDF, Excel, Word...</div>
                    </div>
                    <input type="file" id="${blockId}_input" style="display:none" accept=".pdf,.xlsx,.xls,.doc,.docx" onchange="handleFileSelect(this, '${blockId}')">
                    <input type="hidden" class="doc-naziv" value="">
                    <input type="hidden" class="doc-url" value="">
                    <input type="hidden" class="doc-file-content" value="">`;
            }
            container.appendChild(div);
        }

        // ===== HANDLE FILE SELECT =====
        function handleFileSelect(input, blockId) {
            const file = input.files[0];
            if (!file) return;

            const block = document.querySelector(`[data-block-id="${blockId}"]`);
            const reader = new FileReader();

            reader.onload = function(e) {
                // base64 sadržaj filea (bez data:...;base64, prefiksa)
                const base64 = e.target.result.split(',')[1];
                const url = `documents/${file.name}`;

                block.querySelector('.doc-naziv').value = file.name;
                block.querySelector('.doc-url').value = url;
                block.querySelector('.doc-file-content').value = base64;

                // Ažuriraj UI
                block.querySelector('.doc-upload-area').innerHTML = `
                    <div class="doc-upload-icon">✅</div>
                    <div class="doc-upload-text" style="color:#2e7d32;font-weight:600;">${file.name}</div>
                    <div class="doc-upload-hint">${(file.size / 1024).toFixed(1)} KB · Klikni za promjenu</div>`;
            };

            reader.readAsDataURL(file);
        }

        // ===== SPREMI BRAND =====
        async function saveBrand() {
            const name = document.getElementById('brandName').value.trim();
            if (!name) {
                showToast('❌ Naziv branda je obavezan!', 'error');
                return;
            }

            const servisiBlocks = document.querySelectorAll('#servisiContainer .servis-block');
            const servisi = [];
            const filesToUpload = [];

            servisiBlocks.forEach(block => {
                const naziv = block.querySelector('.servis-naziv').value.trim();
                const dobavljac = block.querySelector('.servis-dobavljac').value.trim();
                const adresa = block.querySelector('.servis-adresa').value.trim();
                const kontakt = block.querySelector('.servis-kontakt').value.trim();
                const napomena = block.querySelector('.servis-napomena').value.trim();
                const website = block.querySelector('.servis-website').value.trim() || null;

                // Dokumenti po servisu
                const documents = [];
                block.querySelectorAll('.document-block').forEach(docBlock => {
                    const docNaziv = docBlock.querySelector('.doc-naziv').value.trim();
                    const docUrl = docBlock.querySelector('.doc-url').value.trim();
                    const docContent = docBlock.querySelector('.doc-file-content').value;
                    if (docNaziv && docUrl) {
                        documents.push({ name: docNaziv, url: docUrl });
                        if (docContent) filesToUpload.push({ name: docNaziv, url: docUrl, content: docContent });
                    }
                });

                servisi.push({ service: naziv, dobavljac, address: adresa, kontakt, napomena, website, documents });
            });

            if (servisi.length === 0) { showToast('❌ Dodaj barem jedan servis!', 'error'); return; }

            const website = null; // website je sada po servisu
            const brandObj = { brand: name, servisi };

            if (editingIndex === -1) {
                brandDatabase.push(brandObj);
            } else {
                brandDatabase[editingIndex] = brandObj;
            }

            closeModal();

            // Spremi na GitHub
            showSaving('Spremam na GitHub...');

            try {
                // 1. Upload novih fileova ako postoje
                if (filesToUpload.length > 0) {
                    for (const file of filesToUpload) {
                        showSaving(`Uploadam ${file.name}...`);
                        await uploadFileToGithub(file.name, file.content);
                    }
                }

                // 2. Spremi brandDatabase.json
                showSaving('Ažuriram bazu podataka...');
                await saveToGithub();
                hideSaving();
                showToast(editingIndex === -1 ? '✅ Brand dodan i spreman na GitHubu!' : '✅ Brand ažuriran na GitHubu!', 'success');
                updateGithubStatus('ok');
            } catch (error) {
                hideSaving();
                showToast(`❌ GitHub greška: ${error.message}`, 'error');
                console.error(error);
                if (editingIndex === -1) {
                    brandDatabase.pop();
                } else {
                    await loadDatabase();
                }
            }

            renderBrandList();
            updateStats();
        }

        // ===== BRIŠI BRAND =====
        async function deleteBrand(idx) {
            const name = brandDatabase[idx].brand;
            if (!confirm(`Jesi li siguran da želiš obrisati "${name}"?`)) return;

            brandDatabase.splice(idx, 1);

            showSaving('Brišem s GitHuba...');

            try {
                await saveToGithub();
                hideSaving();
                showToast(`🗑️ "${name}" obrisan!`, 'success');
                updateGithubStatus('ok');
            } catch (error) {
                hideSaving();
                showToast(`❌ GitHub greška: ${error.message}`, 'error');
                await loadDatabase(); // Vrati stanje
            }

            renderBrandList();
            updateStats();
        }

        // ===== SAVING OVERLAY =====
        function showSaving(text = 'Spremam...') {
            document.getElementById('savingText').textContent = text;
            document.getElementById('savingOverlay').classList.add('active');
            document.getElementById('saveBtn').disabled = true;
            document.getElementById('addBrandBtn').disabled = true;
        }

        function hideSaving() {
            document.getElementById('savingOverlay').classList.remove('active');
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('addBrandBtn').disabled = false;
        }

        // ===== TOAST =====
        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.className = 'toast ' + type, 4000);
        }

        // ===== HELPER =====
        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
